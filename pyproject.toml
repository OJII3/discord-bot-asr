[project]
name = "discord-bot-asr"
version = "0.1.0"
description = "Faster-whisper ASR WebSocket server for Klein voice chat"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "faster-whisper>=1.1.0",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
asr-server = "asr_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["asr_server"]
