[project]
name = "discord-bot-asr"
version = "0.1.0"
description = "Parakeet ASR WebSocket server for Klein voice chat"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "nemo_toolkit[asr]>=2.4.0,<3",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
asr-server = "discord_bot_asr.parakeet_asr_server:main"
parakeet-asr-server = "discord_bot_asr.parakeet_asr_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["discord_bot_asr*"]
